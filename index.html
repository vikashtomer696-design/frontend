<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisk | Experimental Creative Canvas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="whisk-page">
    <div class="whisk-app">
      <aside class="ingredient-sidebar" aria-label="Whisk ingredients">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">✦</div>
          <div>
            <p class="experimental-pill">Experimental</p>
            <h1>Whisk</h1>
          </div>
        </div>

        <div class="ingredient-stack">
          <section class="ingredient-section" data-ingredient="subject">
            <div class="ingredient-heading">
              <span>Subject</span>
              <div class="ingredient-actions" aria-label="Subject actions">
                <button type="button" class="icon-button" data-action="upload" aria-label="Upload subject image">⇧</button>
                <button type="button" class="icon-button" data-action="random" aria-label="Random subject">⟳</button>
                <button type="button" class="icon-button" data-action="add" aria-label="Add subject">+</button>
              </div>
            </div>
            <input class="file-input" type="file" accept="image/*" aria-label="Choose a subject image" />
            <button type="button" class="drop-card" aria-label="Drop or add a subject image">
              <span class="drop-icon">◎</span>
              <span class="drop-label">Add subject</span>
            </button>
          </section>

          <section class="ingredient-section" data-ingredient="scene">
            <div class="ingredient-heading">
              <span>Scene</span>
              <div class="ingredient-actions" aria-label="Scene actions">
                <button type="button" class="icon-button" data-action="upload" aria-label="Upload scene image">⇧</button>
                <button type="button" class="icon-button" data-action="random" aria-label="Random scene">⟳</button>
                <button type="button" class="icon-button" data-action="add" aria-label="Add scene">+</button>
              </div>
            </div>
            <input class="file-input" type="file" accept="image/*" aria-label="Choose a scene image" />
            <button type="button" class="drop-card" aria-label="Drop or add a scene image">
              <span class="drop-icon">▧</span>
              <span class="drop-label">Add scene</span>
            </button>
          </section>

          <section class="ingredient-section" data-ingredient="style">
            <div class="ingredient-heading">
              <span>Style</span>
              <div class="ingredient-actions" aria-label="Style actions">
                <button type="button" class="icon-button" data-action="upload" aria-label="Upload style image">⇧</button>
                <button type="button" class="icon-button" data-action="random" aria-label="Random style">⟳</button>
                <button type="button" class="icon-button" data-action="add" aria-label="Add style">+</button>
              </div>
            </div>
            <input class="file-input" type="file" accept="image/*" aria-label="Choose a style image" />
            <button type="button" class="drop-card" aria-label="Drop or add a style image">
              <span class="drop-icon">◒</span>
              <span class="drop-label">Add style</span>
            </button>
          </section>
        </div>
      </aside>

      <main class="canvas-shell">
        <div class="top-controls" aria-label="Canvas controls">
          <button type="button" class="control-button" aria-label="Grid view">
            <span class="grid-glyph" aria-hidden="true"></span>
          </button>
          <button type="button" class="control-button" aria-label="Canvas settings">≡</button>
        </div>

        <section class="whisk-canvas" aria-live="polite">
          <div class="canvas-message">
            <span class="spark" aria-hidden="true">✦</span>
            <p>Add a subject, scene, or style to Whisk!</p>
          </div>
          <div class="canvas-gallery" aria-hidden="true"></div>
        </section>

        <form class="prompt-bar" aria-label="Generate images prompt">
          <button type="button" class="show-images" aria-pressed="false">Show images</button>
          <input type="text" name="prompt" placeholder="Describe what you want to create" autocomplete="off" />
          <button type="submit" class="submit-prompt" aria-label="Submit prompt">➜</button>
        </form>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
